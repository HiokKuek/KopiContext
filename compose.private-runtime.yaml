# Private-server runtime only. No `ports:` are published. An authenticated
# tunnel/reverse proxy may later join `private_api` explicitly.
name: kopicontext-private

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?set in private env file}"
      POSTGRES_USER: "${POSTGRES_USER:?set in private env file}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set in private env file}"
      POSTGRES_MIGRATION_USER: "${POSTGRES_MIGRATION_USER:?set in private env file}"
      POSTGRES_MIGRATION_PASSWORD: "${POSTGRES_MIGRATION_PASSWORD:?set in private env file}"
      POSTGRES_API_USER: "${POSTGRES_API_USER:?set in private env file}"
      POSTGRES_API_PASSWORD: "${POSTGRES_API_PASSWORD:?set in private env file}"
    # Runs only when the named data volume is first initialised. It creates
    # separate DDL and DML roles before migrations begin.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    networks: [private_data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build: { context: ., dockerfile: Dockerfile.private-api }
    image: kopi-context-private-api:local
    command: ["pnpm", "db:migrate"]
    restart: "no"
    environment:
      # Dedicated DDL role; this must not be the API's DML role.
      DATABASE_URL: "${MIGRATION_DATABASE_URL:?set in private env file}"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [private_data]

  api:
    build: { context: ., dockerfile: Dockerfile.private-api }
    image: kopi-context-private-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PRIVATE_API_RUNTIME_MODE: production
      # Inside the container only; compose still publishes no host port.
      PRIVATE_API_HOST: 0.0.0.0
      PRIVATE_API_PORT: "3001"
      DATABASE_URL: "${DATABASE_URL:?set in private env file}"
      PRIVATE_API_SERVICE_CREDENTIAL: "${PRIVATE_API_SERVICE_CREDENTIAL:?set in private env file}"
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [private_api, private_data]
    expose: ["3001"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/v1/healthz',{headers:{Authorization:'Bearer '+process.env.PRIVATE_API_SERVICE_CREDENTIAL}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Intentionally opt-in: an operator must first build a reviewed retrieval/AI
  # adapter into the image and set its local file URL. It has no HTTP port.
  worker:
    profiles: ["source-preparation"]
    build: { context: ., dockerfile: Dockerfile.private-api }
    image: kopi-context-private-api:local
    command: ["pnpm", "worker:start"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:?set in private env file}"
      # Profiles are interpolated even when disabled, so validation happens in
      # the worker runtime when an operator explicitly enables this profile.
      SOURCE_PREPARATION_WORKER_ID: "${SOURCE_PREPARATION_WORKER_ID:-}"
      SOURCE_PREPARATION_ADAPTER_MODULE: "${SOURCE_PREPARATION_ADAPTER_MODULE:-}"
      SOURCE_PREPARATION_WORKER_POLL_INTERVAL_MS: "${SOURCE_PREPARATION_WORKER_POLL_INTERVAL_MS:-1000}"
      SOURCE_PREPARATION_WORKER_LEASE_MS: "${SOURCE_PREPARATION_WORKER_LEASE_MS:-60000}"
      SOURCE_PREPARATION_WORKER_MAX_ATTEMPTS: "${SOURCE_PREPARATION_WORKER_MAX_ATTEMPTS:-3}"
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [private_data]

volumes:
  postgres-data:

networks:
  private_api:
  # Postgres has no route to a tunnel/proxy or host-published service.
  private_data:
    internal: true
